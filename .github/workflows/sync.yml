name: Sync Fantasy Data

on:
  schedule:
    - cron: '0 13 * * 2'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run ESPN sync script
        run: python espn_league_sync.py
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}

      - name: Commit updated data file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add league_data.json
          git commit -m "Auto-update league data" || echo "No changes to commit"
          git push

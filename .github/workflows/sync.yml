name: Sync Fantasy Data

on:
  schedule:
    - cron: '0 13 * * 2'   # every Tuesday 8am ET (13:00 UTC)
  workflow_dispatch: {}     # manual "Run workflow" button

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests espn_api

      - name: Run ESPN sync script
        run: python espn_league_sync.py
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}

      - name: Rebuild dashboard HTML from fresh data
        run: python build_dashboard.py

      - name: Commit updated data + dashboard
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add league_data.json fantasy_power_rankings.html
          git commit -m "Auto-update league data + dashboard" || echo "No changes to commit"
          git push
